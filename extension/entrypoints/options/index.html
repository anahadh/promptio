<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promptio settings</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; font: inherit; }
      button { margin-top: 1.25rem; padding: 0.5rem 1rem; font: inherit; }
      p.note { opacity: 0.7; font-size: 0.9em; }
    </style>
  </head>
  <body>
    <h1>Promptio</h1>
    <p class="note">Your keys are stored only in this browser and sent only to TypeSafe and Anthropic.</p>
    <form id="keys">
      <label for="typesafe">TypeSafe API key (Jev)</label>
      <input id="typesafe" name="typesafe" type="password" autocomplete="off" />
      <label for="anthropic">Anthropic API key</label>
      <input id="anthropic" name="anthropic" type="password" autocomplete="off" />
      <button type="submit">Save</button>
      <span id="status" role="status"></span>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
